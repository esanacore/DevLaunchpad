name: Constitution Doc Freshness

on:
  pull_request:

permissions:
  contents: read

jobs:
  doc-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with submodules and full history
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Confirm constitution submodule is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e constitution/scripts/check_doc_freshness.sh ]; then
            echo "::error::No 'constitution/' submodule found (or it is too old to ship the doc-freshness checker)."
            exit 1
          fi

      - name: Check documentation freshness
        shell: bash
        run: |
          bash constitution/scripts/check_doc_freshness.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            .
