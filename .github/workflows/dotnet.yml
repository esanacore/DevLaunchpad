# Builds the Dev Launchpad Command Palette extension.
# MSIX packaging and multi-architecture publishing are handled separately.

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore DevLaunchpad/DevLaunchpad.csproj -p:Platform=x64

    - name: Build
      run: dotnet build DevLaunchpad/DevLaunchpad.csproj --no-restore -c ${{ matrix.configuration }} -p:Platform=x64
