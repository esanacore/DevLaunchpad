name: README Update Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-readme-update:
    runs-on: ubuntu-latest
    steps:
      - name: Validate README update for code changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.draft) {
              core.info('Draft PR or no PR context; skipping README check.');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            // GITHUB_WORKFLOW_REF format: owner/repo/.github/workflows/file.yml@ref
            const workflowRefPath = (process.env.GITHUB_WORKFLOW_REF || '').split('@')[0];
            const workflowPrefix = `${context.repo.owner}/${context.repo.repo}/`;
            const workflowPath = workflowRefPath.startsWith(workflowPrefix)
              ? workflowRefPath.slice(workflowPrefix.length)
              : '';

            const readmeTouched = files.some(file => file.filename === 'README.md');

            const codeTouched = files.some(file => {
              const path = file.filename;
              if (path === 'README.md' || path.startsWith('docs/')) {
                return false;
              }

              if (path.startsWith('.github/workflows/')) {
                // Exclude this workflow file to avoid a self-referential README requirement.
                if (workflowPath && path === workflowPath) {
                  return false;
                }
                return true;
              }

              return (
                path.endsWith('.cs') ||
                path.endsWith('.csproj') ||
                path.endsWith('.sln') ||
                path.endsWith('.props') ||
                path.endsWith('.targets') ||
                path.endsWith('.appxmanifest')
              );
            });

            if (codeTouched && !readmeTouched) {
              core.setFailed(
                'Code/workflow changes were detected without updating README.md. This check requires a README.md update for qualifying changes.'
              );
              return;
            }

            core.info('README check passed.');
