name: README Update Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-readme-update:
    runs-on: ubuntu-latest
    steps:
      - name: Validate README update for code changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.draft) {
              core.info('Draft PR or no PR context; skipping README check.');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const workflowRef = process.env.GITHUB_WORKFLOW_REF || '';
            const workflowPath = workflowRef ? workflowRef.split('@')[0].split('/').slice(2).join('/') : '';

            const readmeTouched = files.some(file => file.filename === 'README.md');

            const codeTouched = files.some(file => {
              const path = file.filename;
              if (path === 'README.md' || path.startsWith('docs/')) {
                return false;
              }

              if (path.startsWith('.github/workflows/')) {
                if (workflowPath && path === workflowPath) {
                  return false;
                }
                return true;
              }

              return (
                path.endsWith('.cs') ||
                path.endsWith('.csproj') ||
                path.endsWith('.sln') ||
                path.endsWith('.props') ||
                path.endsWith('.targets') ||
                path.endsWith('.appxmanifest')
              );
            });

            if (codeTouched && !readmeTouched) {
              core.setFailed(
                'Code/workflow changes were detected without updating README.md. Update README.md when behavior/setup/workflow docs should change, or explain in the PR why no README update is needed.'
              );
              return;
            }

            core.info('README check passed.');
